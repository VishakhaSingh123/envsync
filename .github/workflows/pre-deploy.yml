name: Pre-Deploy Audit

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

jobs:
  pre-deploy-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install python-dotenv

      - name: Write all env files
        run: |
          echo "${{ secrets.ENV_DEV }}" > .env.dev
          echo "${{ secrets.ENV_STAGING }}" > .env.staging
          echo "${{ secrets.ENV_PRODUCTION }}" > .env.production

      - name: Run Zero-Tolerance Audit
        run: |
          python - <<'EOF'
          import os

          def load_keys(filepath):
              keys = set()
              if not os.path.exists(filepath):
                  print(f"WARNING: {filepath} not found!")
                  return keys
              with open(filepath) as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith('#') and '=' in line:
                          keys.add(line.split('=')[0].strip())
              return keys

          dev_keys = load_keys('.env.dev')
          staging_keys = load_keys('.env.staging')
          prod_keys = load_keys('.env.production')

          all_keys = dev_keys | staging_keys | prod_keys
          drift_found = False

          for key in all_keys:
              missing_in = []
              if key not in dev_keys:
                  missing_in.append('dev')
              if key not in staging_keys:
                  missing_in.append('staging')
              if key not in prod_keys:
                  missing_in.append('production')
              if missing_in:
                  print(f"DRIFT: '{key}' is missing in: {', '.join(missing_in)}")
                  drift_found = True

          if drift_found:
              print("\nZero-tolerance audit FAILED. Deployment is BLOCKED.")
              exit(1)
          else:
              print("All environments are in sync. Deployment is ALLOWED.")
          EOF

      - name: Check for sensitive key leaks
        run: |
          python - <<'EOF'
          import os

          SENSITIVE_KEYWORDS = ['PASSWORD', 'SECRET', 'TOKEN', 'API_KEY', 'PRIVATE']
          files = ['.env.dev', '.env.staging', '.env.production']

          for filepath in files:
              if not os.path.exists(filepath):
                  continue
              with open(filepath) as f:
                  for line in f:
                      line = line.strip()
                      if '=' in line and not line.startswith('#'):
                          key, _, value = line.partition('=')
                          for keyword in SENSITIVE_KEYWORDS:
                              if keyword in key.upper():
                                  print(f"[REDACTED] {key.strip()}=***")
                                  break
                          else:
                              print(f"OK: {key.strip()} is present")
          EOF

      - name: Cleanup env files
        if: always()
        run: |
          rm -f .env.dev .env.staging .env.production